
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="theme-color" content="#080d19">
  <meta name="description" content="منصة حضور طلاب HIMS">

  <title>HIMS | منصة حضور الطلاب</title>

  <link rel="stylesheet" href="shared.css">
</head>

<body>

<!-- =====================================
     تسجيل الدخول
===================================== -->

<div id="loginView" class="login-wrap">

  <div class="panel login-card">

    <div class="brand">
      <img
        class="hims-logo"
        src="https://lmsg2.himsb.online/pluginfile.php/1/theme_academi/logo/1767534359/HIMS.png"
        alt="HIMS"
      >
      HIMS
    </div>

    <h2 style="text-align:center">
      تسجيل دخول الطالب
    </h2>

    <p class="muted" style="text-align:center">
      أدخل بياناتك لتسجيل حضور المحاضرات
    </p>

    <div class="field">
      <label for="studentCode">كود الطالب</label>

      <input
        id="studentCode"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        placeholder="أدخل كود الطالب"
      >
    </div>

    <div class="field">
      <label for="studentNationalId">الرقم القومي</label>

      <input
        id="studentNationalId"
        type="password"
        inputmode="numeric"
        autocomplete="current-password"
        maxlength="14"
        placeholder="أدخل الرقم القومي"
      >
    </div>

    <button
      id="studentLogin"
      class="btn"
      type="button"
      style="width:100%"
    >
      دخول
    </button>

    <div id="loginMsg" aria-live="polite"></div>

    <p class="muted" style="text-align:center;font-size:12px;margin-top:20px">
      HIMS Attendance System
    </p>

  </div>

</div>


<!-- =====================================
     واجهة الطالب
===================================== -->

<div
  id="studentView"
  class="student-main"
  style="display:none"
>

  <header class="topbar">

    <div class="brand">
      <img
        class="hims-logo"
        src="https://lmsg2.himsb.online/pluginfile.php/1/theme_academi/logo/1767534359/HIMS.png"
        alt="HIMS"
      >
      HIMS
    </div>

    <button
      id="logout"
      class="btn secondary"
      type="button"
    >
      تسجيل الخروج
    </button>

  </header>


  <!-- بيانات الطالب -->

  <section class="panel student-card">

    <span class="pill green">
      حساب الطالب
    </span>

    <h2 id="welcomeName">
      أهلاً بك
    </h2>

    <p
      id="welcomeBranch"
      class="muted"
      style="font-weight:800;margin-top:-8px"
    >
      الفرقة: — | الشعبة: —
    </p>

    <div class="divider-line"></div>

    <p class="muted">
      امسح رمز QR الخاص بمحاضرتك لتسجيل الحضور.
    </p>


    <!-- مسح QR -->

    <div class="scan-section">

      <button
        id="scanBtn"
        class="btn"
        type="button"
      >
        فتح الكاميرا ومسح QR
      </button>

      <div
        id="reader"
        class="scanner"
      ></div>

      <div
        id="resultMsg"
        aria-live="polite"
      ></div>

    </div>

    <p class="muted" style="font-size:12px;margin-top:18px">
      تأكد من مسح QR الخاص بالفرقة والشعبة المسجل بهما.
    </p>

  </section>

</div>


<!-- =====================================
     مكتبة QR
===================================== -->

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<!-- JavaScript -->

<script type="module" src="student.js"></script>

</body>
</html>
